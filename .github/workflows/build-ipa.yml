name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        env:
          CROSSBUILD_BUILD_NUMBER: ${{ github.run_number }}
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild             -project CrossBuild.xcodeproj             -scheme CrossBuild             -configuration Release             -sdk iphoneos             -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build | tee build.log

      - name: Package IPA
        run: |
          APP="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          rm -rf Payload CrossBuild.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CrossBuild.ipa Payload
          shasum -a 256 CrossBuild.ipa | tee CrossBuild.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CrossBuild-IPA
          path: |
            CrossBuild.ipa
            CrossBuild.ipa.sha256
            build.log
          if-no-files-found: error
