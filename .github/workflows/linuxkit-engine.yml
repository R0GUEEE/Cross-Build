name: Build ios-linuxkit engine

# Deliberately a separate workflow from Build IPA. Cross-compiling a third-party
# C engine for iOS is the critical unknown for the embedded-Linux work, and
# iterating on it here keeps the app build green and independently verifiable.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/linuxkit-engine.yml'
      - 'Tools/linuxkit-cross-ios.txt'

jobs:
  engine:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install meson ninja

      - name: Vendor ios-linuxkit
        run: |
          set -euo pipefail
          PINNED=c1a4064e84f1a957280a62f77d107162032dc908   # 2.4.1 build 818
          mkdir -p Vendor
          git clone --filter=blob:none https://github.com/rcarmo/ios-linuxkit.git Vendor/linuxkit
          cd Vendor/linuxkit
          git checkout "$PINNED"
          git submodule update --init --recursive --depth 1 || echo "::warning::submodule init failed; continuing"
          git rev-parse HEAD

      - name: Patch platform/darwin.c for libdispatch
        run: |
          set -euo pipefail
          cd Vendor/linuxkit
          # platform/darwin.c calls dispatch_once but relies on a system header
          # bringing libdispatch in transitively, which stops happening once the
          # strict C level is set. Adding the include to this one file is the
          # narrow fix; passing it as a global -include also reaches the .S
          # gadget sources and breaks the assembler.
          printf '#include <dispatch/dispatch.h>\n' > /tmp/darwin.c
          cat platform/darwin.c >> /tmp/darwin.c
          mv /tmp/darwin.c platform/darwin.c
          head -3 platform/darwin.c

      - name: Cross-compile engine for iOS arm64
        run: |
          set -euo pipefail
          cd Vendor/linuxkit
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDK"
          sed "s|@IOS_SDK@|$SDK|" "$GITHUB_WORKSPACE/Tools/linuxkit-cross-ios.txt" > cross-ios.txt
          cat cross-ios.txt
          meson setup build-ios --cross-file cross-ios.txt \
            -Dguest_arch=arm64 -Djit=false -Djit_emit=false -Dcli_aot= \
            --buildtype=release
          meson compile -C build-ios

      - name: Cross-compile AOT candidate engine for iOS arm64
        run: |
          set -euo pipefail
          cd Vendor/linuxkit
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          sed "s|@IOS_SDK@|$SDK|" "$GITHUB_WORKSPACE/Tools/linuxkit-cross-ios.txt" > cross-ios-aot.txt

          # This is the isolated Apple AOT backend configuration described by
          # ios-linuxkit. Runtime native-code emission is compile-time disabled.
          # AOT images are intentionally linked in a later stage because their
          # Mach-O assembly is ABI/hash-bound to the exact bootstrap app.
          meson setup build-ios-aot --cross-file cross-ios-aot.txt             -Dguest_arch=arm64 -Djit=true -Djit_emit=false -Dcli_aot=             --buildtype=release
          meson compile -C build-ios-aot

      - name: Inspect produced libraries
        run: |
          set -euo pipefail
          cd Vendor/linuxkit
          for build in build-ios build-ios-aot; do
            echo "=== $build static libraries ==="
            find "$build" -name '*.a' -exec ls -la {} \;
            echo "=== $build arch check (must be arm64 iOS, not macOS) ==="
            for lib in $(find "$build" -name '*.a'); do
              echo "--- $lib"
              lipo -info "$lib" || true
              file "$lib" | head -1
              otool -l "$lib" 2>/dev/null | grep -A3 LC_BUILD_VERSION | head -8 || true
            done
          done

      - name: Upload engine libraries
        uses: actions/upload-artifact@v4
        with:
          name: linuxkit-engine-ios
          path: |
            Vendor/linuxkit/build-ios/**/*.a
            Vendor/linuxkit/build-ios-aot/**/*.a
          if-no-files-found: error
