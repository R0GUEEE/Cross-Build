name: CrossBuild
options:
  bundleIdPrefix: dev.rogueee
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  CrossBuild:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CrossBuild
        excludes:
          - Resources/Toolchains
          - Assets.xcassets/AppIcon.appiconset/make_icon.py
      # The execution helper is bundled straight from Tools/ rather than copied
      # into the app tree, so there is exactly one copy of it and the two cannot
      # drift apart. buildPhase is forced because a .py file has no default phase.
      - path: Tools/crossbuild-helper.py
        buildPhase: resources
    resources:
      - path: CrossBuild/Resources/Toolchains
        type: folder
    dependencies:
      - package: ZIPFoundation
      - target: CrossBuildClang
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rogueee.crossbuild
        PRODUCT_NAME: CrossBuild
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "${CROSSBUILD_BUILD_NUMBER}"
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Cross Build"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme:
      testTargets: []

  CrossBuildClang:
    # Static library, NOT a framework. It is always present and always linked
    # into the app, so there is nothing to embed -- which matters because iOS
    # installd rejects an embedded .framework that lacks an Info.plist, and a
    # bundle that exists only to hold a stub was not worth that failure mode.
    #
    # Shape intentionally mirrors XcodeGen's own tested static-library fixture
    # (Tests/Fixtures/TestProject/StaticLibrary_ObjC): type library.static, a
    # plain sources path, and a Module/module.modulemap beside the header.
    # Deliberately NOT set: DEFINES_MODULE and MODULEMAP_FILE. Either one makes
    # clang see both the source module map and XcodeGen's copy of it in
    # include/$(PRODUCT_NAME), producing
    # "redefinition of module 'CrossBuildClang'".
    type: library.static
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Native/CrossBuildClang
    settings:
      base:
        PRODUCT_NAME: CrossBuildClang
        PRODUCT_BUNDLE_IDENTIFIER: dev.rogueee.crossbuild.clang
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        GENERATE_INFOPLIST_FILE: NO
        MACH_O_TYPE: staticlib
