name: CrossBuild
options:
  bundleIdPrefix: dev.rogueee
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  CrossBuild:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CrossBuild
        excludes:
          - Resources/Toolchains
          - Assets.xcassets/AppIcon.appiconset/make_icon.py
    resources:
      - path: CrossBuild/Resources/Toolchains
        type: folder
    dependencies:
      - package: ZIPFoundation
      - target: CrossBuildClang
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rogueee.crossbuild
        PRODUCT_NAME: CrossBuild
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "${CROSSBUILD_BUILD_NUMBER}"
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Cross Build"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Where the Swift compiler looks for the CrossBuildClang module map, and
        # where clang finds the umbrella header it references.
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Native/CrossBuildClang"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Native/CrossBuildClang"
    scheme:
      testTargets: []

  CrossBuildClang:
    # Static library, NOT a framework. It is always present and always linked
    # into the app, so there is nothing to embed -- which matters because iOS
    # installd rejects an embedded .framework that lacks an Info.plist, and a
    # bundle that exists only to hold a stub was not worth that failure mode.
    type: library.static
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Native/CrossBuildClang
    settings:
      base:
        PRODUCT_NAME: CrossBuildClang
        PRODUCT_BUNDLE_IDENTIFIER: dev.rogueee.crossbuild.clang
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        GENERATE_INFOPLIST_FILE: NO
        MACH_O_TYPE: staticlib
        # Static libraries do NOT get an auto-generated module map the way
        # framework targets do (yonaskolb/XcodeGen#350), so point the build at
        # the module.modulemap checked in next to the header. Also tell the
        # consuming Swift target where to find it.
        MODULEMAP_FILE: "$(SRCROOT)/Native/CrossBuildClang/module.modulemap"
