name: CrossBuild
options:
  bundleIdPrefix: dev.rogueee
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  CrossBuild:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CrossBuild
        excludes:
          - Resources/Toolchains
          - Assets.xcassets/AppIcon.appiconset/make_icon.py
      # Bundled as a folder reference, declared here rather than under the
      # `resources:` shortcut. The shortcut never actually put this folder into
      # the built .app -- three consecutive IPAs contained zero Toolchains
      # entries -- while the app reads these manifests at runtime. Declaring it
      # as an explicit source with buildPhase: resources is the form XcodeGen
      # documents, and the "Verify bundled resources" CI step now fails the build
      # if it ever stops being copied again.
      - path: CrossBuild/Resources/Toolchains
        type: folder
        buildPhase: resources
      # Vendored CPython support package (see the "Vendor Python runtime" CI step).
      # Neither path exists in a clean checkout, so both are gitignored; the CI
      # step fails the build with a clear message if they are missing.
      #
      # The bundle layout is the one CPython documents for iOS: `python` is
      # PYTHONHOME and contains lib/python3.13 (plus lib-dynload), and `app` is on
      # PYTHONPATH for user code.
      - path: Vendor/Python/stdlib/python
        type: folder
        buildPhase: resources
      - path: Vendor/Python/stdlib/app
        type: folder
        buildPhase: resources
      # The Alpine minirootfs, converted to the SQLite-backed fakefs image the
      # Linux guest boots from (see the "Build Linux rootfs" CI step). The guest
      # needs no host filesystem access because the whole root is in this image.
      - path: Vendor/linuxkit/fakefs-root
        type: folder
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
      - target: CrossBuildClang
      - target: CrossBuildPython
      - target: CrossBuildLinux
      # Embedded CPython. Dynamic framework, so it is linked and embedded into the
      # app; the support package ships it with its own Info.plist, which is the
      # thing installd insists on for embedded frameworks.
      - framework: Vendor/Python/Python.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rogueee.crossbuild
        PRODUCT_NAME: CrossBuild
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "${CROSSBUILD_BUILD_NUMBER}"
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Cross Build"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # The workspace the app edits lives in the app's Documents directory. No
        # one can see it -- or drop files into it -- from Files.app unless these
        # two are set, which made an otherwise complete workbench a dead end for
        # getting code in and builds out. UIFileSharingEnabled exposes Documents
        # under "On My iPhone"; LSSupportsOpeningDocumentsInPlace lets the app be
        # handed a file that lives outside its container instead of forcing a copy.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The ios-linuxkit engine is vendored as prebuilt static libraries (built
        # by the "Build iOS Linux engine" step), because it is a Meson project and
        # rebuilding it inside the app target is not practical. Linking by path is
        # explicit, so a missing library fails the link loudly rather than being
        # silently skipped.
        OTHER_LDFLAGS: "-L$(SRCROOT)/Vendor/linuxkit/build-ios -lish_emu -lish -lfakefs -lsqlite3 -ObjC"
    scheme:
      testTargets: []

  CrossBuildClang:
    # Static library, NOT a framework. It is always present and always linked
    # into the app, so there is nothing to embed -- which matters because iOS
    # installd rejects an embedded .framework that lacks an Info.plist, and a
    # bundle that exists only to hold a stub was not worth that failure mode.
    #
    # Shape intentionally mirrors XcodeGen's own tested static-library fixture
    # (Tests/Fixtures/TestProject/StaticLibrary_ObjC): type library.static, a
    # plain sources path, and a Module/module.modulemap beside the header.
    # Deliberately NOT set: DEFINES_MODULE and MODULEMAP_FILE. Either one makes
    # clang see both the source module map and XcodeGen's copy of it in
    # include/$(PRODUCT_NAME), producing
    # "redefinition of module 'CrossBuildClang'".
    type: library.static
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Native/CrossBuildClang
    settings:
      base:
        PRODUCT_NAME: CrossBuildClang
        PRODUCT_BUNDLE_IDENTIFIER: dev.rogueee.crossbuild.clang
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        GENERATE_INFOPLIST_FILE: NO
        MACH_O_TYPE: staticlib

  CrossBuildLinux:
    # C shim over the ios-linuxkit engine. It includes the engine's own
    # xX_main_Xx.h and drives the boot sequence, so it needs the vendored source
    # tree on its header search path and the same GUEST_ARM64 define the engine
    # is built with. Static library, like the other two shims; the app target does
    # the linking, since a static library links nothing.
    type: library.static
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Native/CrossBuildLinux
    settings:
      base:
        PRODUCT_NAME: CrossBuildLinux
        PRODUCT_BUNDLE_IDENTIFIER: dev.rogueee.crossbuild.linux
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
        MACH_O_TYPE: staticlib
        CLANG_C_LANGUAGE_STANDARD: gnu11
        GCC_PREPROCESSOR_DEFINITIONS: GUEST_ARM64=1 DEBUG=1
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/linuxkit $(SRCROOT)/Vendor/linuxkit/build-ios"
        # The engine's headers pull in the SDK's ucontext.h, which refuses to
        # declare the deprecated ucontext routines unless _XOPEN_SOURCE is
        # defined; _DARWIN_C_SOURCE must come with it or Darwin's full C level
        # stays off and DT_*/fstatat/makedev disappear.
        OTHER_CFLAGS: "-D_XOPEN_SOURCE=600 -D_DARWIN_C_SOURCE"
        USER_HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/linuxkit"

  CrossBuildPython:
    # C shim over the vendored CPython runtime. Same static-library shape as
    # CrossBuildClang, so Swift imports it as a module and never sees Python.h.
    # It needs the framework only for headers; the app target does the linking
    # and embedding, because a static library does not link anything.
    type: library.static
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Native/CrossBuildPython
    dependencies:
      - framework: Vendor/Python/Python.xcframework
        embed: false
        link: false
    settings:
      base:
        PRODUCT_NAME: CrossBuildPython
        PRODUCT_BUNDLE_IDENTIFIER: dev.rogueee.crossbuild.python
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
        MACH_O_TYPE: staticlib
        CLANG_ENABLE_MODULES: YES
